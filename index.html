<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tripbox · Tu viaje, paso a paso</title>
  <meta name="description" content="Tripbox: organizá tu viaje desde cero con una guía paso a paso que prioriza por vos: pasajes, alojamiento, documentos, itinerario y gastos compartidos.">
  <meta name="theme-color" content="#2f7d7b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tripbox">
  <link rel="icon" type="image/png" sizes="32x32" href="iconos/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="iconos/icono-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="barra">
    <a href="#inicio" class="marca" aria-label="Tripbox, inicio">
      <span class="marca-logo" aria-hidden="true"></span>
      <span>Tripbox</span>
    </a>
    <nav class="nav" aria-label="Principal">
      <a href="#inicio" data-nav="inicio">Mis viajes</a>
      <a href="#valijas" data-nav="valijas">Mis listas</a>
      <a href="#personas" data-nav="personas">Compañeros</a>
    </nav>
    <button class="btn btn-primario btn-chico" id="btnNuevoViajeBarra" type="button">+ Nuevo viaje</button>
    <button class="boton-usuario" id="btnUsuario" type="button" aria-label="Mi cuenta"></button>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <!-- Navegación tipo app (celular) -->
  <nav class="nav-inferior" aria-label="Navegación principal">
    <a href="#inicio" data-nav="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>Viajes</a>
    <a href="#valijas" data-nav="valijas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>Listas</a>
    <button type="button" class="nav-nuevo" id="btnNuevoViajeNav" aria-label="Nuevo viaje"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <a href="#personas" data-nav="personas"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>Compañeros</a>
    <button type="button" id="btnCuentaNav"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Cuenta</button>
  </nav>

  <div id="capaModal"></div>
  <div id="toast" class="toast" role="status"></div>

  <!-- Base -->
  <script src="js/utilidades.js"></script>
  <script src="js/almacenamiento.js"></script>
  <script src="js/lugares.js"></script>
  <script src="js/recorrido.js"></script>
  <script src="js/paisajeviaje.js"></script>
  <script src="js/aeropuertosdatos.js"></script>
  <script src="js/aeropuertos.js"></script>
  <script src="js/requisitosviaje.js"></script>
  <script src="js/autenticacion.js"></script>
  <!-- Inteligencia de la guía -->
  <script src="js/plantillaguia.js"></script>
  <script src="js/motorprioridad.js"></script>
  <script src="js/formulariospasos.js"></script>
  <!-- Secciones -->
  <script src="js/viajes.js"></script>
  <script src="js/vistaguia.js"></script>
  <script src="js/itinerario.js"></script>
  <script src="js/documentos.js"></script>
  <script src="js/gastos.js"></script>
  <script src="js/participantes.js"></script>
  <script src="js/valija.js"></script>
  <!-- Arranque -->
  <script src="main.js"></script>
</body>
</html>
