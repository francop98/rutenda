  <meta name="apple-mobile-web-app-title" content="Rutenda">

  <link rel="stylesheet" href="styles.css">
  <script>/* Modo claro u oscuro elegido en Mi cuenta (antes de dibujar, para que no parpadee) */
    try { var t = localStorage.getItem('rutenda_tema'); if (t === 'claro' || t === 'oscuro') document.documentElement.setAttribute('data-tema', t); } catch (e) {}</script>

<body>
  <header class="barra">
    <button class="btn-menu" id="btnMenu" type="button" aria-label="Menú" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button class="btn-atras" id="btnAtras" type="button" aria-label="Volver" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Volver</span></button>
    <a href="#inicio" class="marca" aria-label="Rutenda, inicio">

      <span>Rutenda</span>
    </a>

    </nav>
    <button class="btn btn-suave btn-chico" id="btnCargarBarra" type="button">💸 Cargar</button>
    <button class="btn btn-primario btn-chico" id="btnNuevoViajeBarra" type="button">+ Nuevo viaje</button>
    <button class="btn-nuevo-viaje" id="btnNuevoViajeNav" type="button" aria-label="Nuevo viaje" title="Nuevo viaje"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <!-- Navegación tipo app (celular) -->
  <nav class="nav-inferior" aria-label="Navegación principal">
    <a href="#inicio" data-nav="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v11h13V9"/><path d="M10 20v-5.5h4V20"/></svg>Inicio</a>

  <div id="toast" class="toast" role="status"></div>
