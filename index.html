<!doctype html>
<html lang="es">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rutenda · Tu viaje, paso a paso</title>
  <meta name="description" content="Rutenda: organizá tu viaje desde cero con una guía paso a paso que prioriza por vos: pasajes, alojamiento, documentos, itinerario y gastos compartidos.">
  <meta name="theme-color" content="#1F3A36">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icono-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Cormorant+Garamond:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

<body>
  <header class="barra">
    <a href="#inicio" class="marca" aria-label="Rutenda, inicio">
      <span class="marca-logo" aria-hidden="true"></span>
      <span>Rutenda</span>
    </a>
    <nav class="nav" aria-label="Principal">
      <a href="#inicio" data-nav="inicio">Inicio</a>
      <a href="#viajes" data-nav="viajes">Mis viajes</a>
      <a href="#valijas" data-nav="valijas">Mis listas</a>
      <a href="#personas" data-nav="personas">Compañeros</a>
    </nav>
    <button class="btn btn-primario btn-chico" id="btnNuevoViajeBarra" type="button">+ Nuevo viaje</button>
    <button class="boton-usuario" id="btnUsuario" type="button" aria-label="Mi cuenta"></button>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <!-- Navegación tipo app (celular) -->
  <nav class="nav-inferior" aria-label="Navegación principal">
    <a href="#inicio" data-nav="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v11h13V9"/><path d="M10 20v-5.5h4V20"/></svg>Inicio</a>
    <a href="#viajes" data-nav="viajes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>Viajes</a>

    <a href="#valijas" data-nav="valijas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>Listas</a>
    <button type="button" id="btnCuentaNav"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Cuenta</button>
  </nav>

  <div id="capaModal"></div>
  <div id="toast" class="toast" role="status"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="js/firebaseconfig.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/sincronizacion.js"></script>
